<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Tournament Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <ul class="nav-links"> 
            <li><a href="{{ url_for( 'index' )}}"{% if request.endpoint == 'index' %} class="active"{% endif %}>Home</a></li>
            <li><a href="{{ url_for('bracket')}}"{% if request.endpoint == 'bracket' %} class="active"{% endif %}>Generator</a></li>
            <li><a href="{{ url_for('rules')}}"{% if request.endpoint == 'rules' %} class="active"{% endif %}>Rules</a></li>
        </ul>
        <div class="theme-button-wrapper" id="theme-toggle">
           <button class="theme-icon-btn" id="icon-btn" onclick="toggleExpand()">
                <i class="fa-solid fa-sun"></i>
            </button> 
            <div class="theme-text-wrapper">
                <div class="theme-text-wrapper-inner">
                    <button class="theme-text-btn" id="text-btn" onclick="toggleTheme()">Light Mode</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
    {% block content %}
    {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script>
        const themeWrapper = document.getElementById('theme-toggle');
        const iconBtn = document.getElementById('icon-btn');
        const textBtn = document.getElementById('text-btn');
        let isExpanded = false;
        let isDarkMode = true;

        function toggleExpand() {
            themeWrapper.classList.toggle('expanded');
            isExpanded = !isExpanded;
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;

            if (isDarkMode) {
                document.body.classList.remove('light-mode');
                iconBtn.innerHTML = '<i class="fas fa-sun"></i>';
                textBtn.textContent = 'Light Mode';
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.classList.add('light-mode');
                iconBtn.innerHTML = '<i class="fas fa-moon"></i>';
                textBtn.textContent = 'Dark Mode';
                localStorage.setItem('theme', 'light');
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'light') {
                toggleTheme();
            }
        });
    </script>
</body>
</html>
