<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Tournament Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <ul class="nav-links"> 
            <li><a href="{{ url_for( 'index' )}}"{% if request.endpoint == 'index' %} class="active"{% endif %}>Home</a></li>
            <li><a href="{{ url_for('bracket')}}"{% if request.endpoint == 'bracket' %} class="active"{% endif %}>Generator</a></li>
            <li><a href="{{ url_for('rules')}}"{% if request.endpoint == 'rules' %} class="active"{% endif %}>Rules</a></li>
            <li><a href="{{ url_for('join_bracket')}}"{% if request.endpoint == 'join_bracket' %} class="active"{% endif %}>Join</a></li>
        </ul>
        <div class="theme-button-wrapper" id="theme-toggle">
           <button class="theme-icon-btn" id="icon-btn" onclick="toggleExpand()">
                <i class="fa-solid fa-sun"></i>
            </button> 
            <div class="theme-text-wrapper">
                <div class="theme-text-wrapper-inner">
                    <button class="theme-text-btn" id="text-btn" onclick="toggleTheme()">Light Mode</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
    {% block content %}
    {% endblock %}
    </div>

    <!-- CONFIRM COMPONENT — OPTION A: MODAL
         Add data-confirm="Your message here" to ANY <form> or <a> and it
         will pop this shared modal before letting the action through.

         Usage examples:
           <form action="..." method="POST" data-confirm="Are you sure?">
               <button type="submit">Do the thing</button>
           </form>

           <a href="/delete/5" data-confirm="Delete this permanently?">Delete</a>
    -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content confirm-modal-content">
          <div class="modal-body">
            <p id="confirmModalMessage" class="confirm-modal-message">Are you sure?</p>
          </div>
          <div class="modal-footer confirm-modal-footer">
            <button type="button" class="btn confirm-modal-cancel" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn confirm-modal-confirm" id="confirmModalConfirmBtn">Confirm</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <script>
        const themeWrapper = document.getElementById('theme-toggle');
        const iconBtn = document.getElementById('icon-btn');
        const textBtn = document.getElementById('text-btn');
        let isExpanded = false;
        let isDarkMode = true;

        function toggleExpand() {
            themeWrapper.classList.toggle('expanded');
            isExpanded = !isExpanded;
        }

        function toggleTheme() {
            isDarkMode = !isDarkMode;

            if (isDarkMode) {
                document.body.classList.remove('light-mode');
                iconBtn.innerHTML = '<i class="fas fa-sun"></i>';
                textBtn.textContent = 'Light Mode';
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.classList.add('light-mode');
                iconBtn.innerHTML = '<i class="fas fa-moon"></i>';
                textBtn.textContent = 'Dark Mode';
                localStorage.setItem('theme', 'light');
            }
        }

        window.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'light') {
                toggleTheme();
            }
        });
    </script>

    <script>
        // GLOBAL "ARE YOU SURE?" HANDLER — OPTION A: MODAL
        // Watches the whole page for any form or link with a data-confirm
        // attribute and pops the shared modal before letting the action
        // through. Works automatically on new elements too, since it
        // listens on the document rather than on specific buttons.
        (function () {
            const modalEl = document.getElementById('confirmModal');
            const modalMessage = document.getElementById('confirmModalMessage');
            const confirmBtn = document.getElementById('confirmModalConfirmBtn');
            const modal = new bootstrap.Modal(modalEl);

            let pendingElement = null; // the <form> or <a> waiting on confirmation

            function requestConfirmation(el) {
                pendingElement = el;
                modalMessage.textContent = el.getAttribute('data-confirm') || 'Are you sure?';
                modal.show();
            }

            // Intercept submission of any form with data-confirm
            document.addEventListener('submit', function (e) {
                const form = e.target;
                if (form.hasAttribute && form.hasAttribute('data-confirm') && !form.dataset.confirmed) {
                    e.preventDefault();
                    requestConfirmation(form);
                }
            });

            // Intercept clicks on any link (or non-form element) with data-confirm
            document.addEventListener('click', function (e) {
                const el = e.target.closest('[data-confirm]');
                if (!el) return;
                if (el.tagName === 'FORM') return;   // handled by the submit listener above
                if (el.closest('form')) return;      // it's inside a form — let the form's data-confirm handle it
                if (el.dataset.confirmed) return;

                e.preventDefault();
                requestConfirmation(el);
            });

            confirmBtn.addEventListener('click', function () {
                modal.hide();
                if (!pendingElement) return;

                if (pendingElement.tagName === 'FORM') {
                    pendingElement.dataset.confirmed = 'true';
                    pendingElement.submit();
                } else if (pendingElement.tagName === 'A') {
                    pendingElement.dataset.confirmed = 'true';
                    window.location.href = pendingElement.href;
                } else {
                    pendingElement.dataset.confirmed = 'true';
                    pendingElement.click();
                }

                pendingElement = null;
            });

            // If the user cancels/dismisses without confirming, clear the flag
            // so the same element can trigger the modal again next time.
            modalEl.addEventListener('hidden.bs.modal', function () {
                if (pendingElement) {
                    delete pendingElement.dataset.confirmed;
                    pendingElement = null;
                }
            });
        })();
    </script>

    <script>
        // CONFIRM COMPONENT — OPTION B: TYPE TO CONFIRM
        // No popup, no hold, no button animation. Add
        // data-confirm-type="CONFIRM" (or any word) to a <form> or <a>.
        // Clicking it HIDES the button and replaces it with a text box
        // right there on the page. The action only fires once the exact
        // word is typed and the new "Go" button is pressed.
        //
        // Usage:
        //   <form action="..." method="POST" data-confirm-type="SHUFFLE">
        //       <button type="submit">Shuffle Round</button>
        //   </form>
        (function () {
            document.addEventListener('click', function (e) {
                const trigger = e.target.closest('[data-confirm-type]') ||
                                 (e.target.closest('form[data-confirm-type]') ? e.target.closest('form[data-confirm-type]') : null);

                let host = e.target.closest('[data-confirm-type]');
                if (!host) return;
                if (host.dataset.typeConfirmed === 'true') return; // already passed, let it through
                if (host.dataset.typeBuilt === 'true') return; // panel already open, ignore re-clicks on the hidden original

                const isForm = host.tagName === 'FORM';
                if (isForm) {
                    // Stop the actual submit; we intercept the button click instead.
                    if (e.target.closest('button, input[type="submit"]')) {
                        e.preventDefault();
                    } else {
                        return;
                    }
                } else {
                    e.preventDefault();
                }

                buildPanel(host, isForm);
            });

            function buildPanel(host, isForm) {
                const requiredWord = host.getAttribute('data-confirm-type') || 'CONFIRM';
                host.dataset.typeBuilt = 'true';

                // Hide the original trigger content but keep the element
                // itself (a <form> or <a>) so its action/href still works.
                const originalChildren = Array.from(host.childNodes);
                originalChildren.forEach(function (node) {
                    if (node.nodeType === 1) node.style.display = 'none';
                });

                const panel = document.createElement('div');
                panel.className = 'confirm-type-panel';
                panel.innerHTML =
                    '<label class="confirm-type-label">Type <strong>' + requiredWord + '</strong> to proceed</label>' +
                    '<div class="confirm-type-row">' +
                        '<input type="text" class="confirm-type-input" autocomplete="off" placeholder="' + requiredWord + '">' +
                        '<button type="button" class="confirm-type-go" disabled>Go</button>' +
                        '<button type="button" class="confirm-type-cancel">Cancel</button>' +
                    '</div>';
                host.appendChild(panel);

                const input = panel.querySelector('.confirm-type-input');
                const goBtn = panel.querySelector('.confirm-type-go');
                const cancelBtn = panel.querySelector('.confirm-type-cancel');

                input.addEventListener('input', function () {
                    goBtn.disabled = input.value.trim().toUpperCase() !== requiredWord.toUpperCase();
                });

                input.focus();

                function teardown() {
                    panel.remove();
                    originalChildren.forEach(function (node) {
                        if (node.nodeType === 1) node.style.display = '';
                    });
                    delete host.dataset.typeBuilt;
                }

                cancelBtn.addEventListener('click', function () {
                    teardown();
                });

                goBtn.addEventListener('click', function () {
                    host.dataset.typeConfirmed = 'true';
                    teardown();
                    if (isForm) {
                        host.submit();
                    } else if (host.tagName === 'A') {
                        window.location.href = host.href;
                    } else {
                        host.click();
                    }
                    delete host.dataset.typeConfirmed;
                });

                input.addEventListener('keydown', function (e) {
                    if (e.key === 'Enter' && !goBtn.disabled) {
                        goBtn.click();
                    } else if (e.key === 'Escape') {
                        teardown();
                    }
                });
            }
        })();
    </script>
</body>
</html>
