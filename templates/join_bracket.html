{% extends 'base.html' %}

{% block content %}
<div class="join-container">
    <div class="join-card">
        <h1>Join a Tournament</h1>
        <p class="join-subtitle">Enter the access code to view a tournament bracket</p>

        <form method="POST" action="{{ url_for('access_bracket') }}" class="join-form">
            <div class="form-group">
                <label for="access_code">Access code</label>
                <input
                    type="text"
                    id="access_code"
                    name="access_code"
                    placeholder="e.g., ABC123"
                    maxlength="6"
                    required
                    class="code-input"
                >
            </div>

            <button type="submit" class="btn-primary">View bracket</button>
        </form>

        <div class="divider">or</div>

        <a href="{{ url_for('bracket') }}" class="btn-secondary">Create new bracket</a>

        <div class="join-info">
            <p><strong>Don't have a code?</strong> Ask the tournament organiser for the access code they received when they created the bracket.</p>
        </div>
    </div>
</div>
    
{% endblock %}
