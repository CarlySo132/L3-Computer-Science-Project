{% extends 'base.html' %}

{% block content %}
<h1>Welcome to the Tournament Generator!</h1>
<p>Create and manage your tournaments with ease.</p>

<div class="scoreboard-v2" id="scoreboard-v2">
    <div class="scoreboard-v2-side">
        <input type="text" class="scoreboard-v2-name" value="Team A" maxlength="20">
        <input type="number" class="scoreboard-v2-input" id="scoreboard-v2-left" value="0" min="0" inputmode="numeric">
    </div>

    <span class="scoreboard-divider">—</span>

    <div class="scoreboard-v2-side">
        <input type="text" class="scoreboard-v2-name" value="Team B" maxlength="20">
        <input type="number" class="scoreboard-v2-input" id="scoreboard-v2-right" value="0" min="0" inputmode="numeric">
    </div>
</div>

<button type="button" class="scoreboard-reset" id="scoreboard-v2-reset">Reset Score</button>

<img src="{{ url_for('static', filename='depositphotos_19085613-stock-illustration-sport-and-exercise.jpg') }}" alt="Tournament Image">

<script>
    (function () {
        const v2Left = document.getElementById('scoreboard-v2-left');
        const v2Right = document.getElementById('scoreboard-v2-right');
        const v2ResetBtn = document.getElementById('scoreboard-v2-reset');

        function clampNonNegative(input) {
            let val = parseInt(input.value, 10);
            if (isNaN(val) || val < 0) val = 0;
            input.value = val;
        }

        [v2Left, v2Right].forEach(function (input) {
            input.addEventListener('input', function () {
                clampNonNegative(input);
            });
        });

        v2ResetBtn.addEventListener('click', function () {
            v2Left.value = 0;
            v2Right.value = 0;
        });
    })();
</script>
{% endblock %}
