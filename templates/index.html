{% extends 'base.html' %}

{% block content %}
<h1>Welcome to the Tournament Generator!</h1>
<p>Create and manage your tournaments with ease.</p>

<div class="scoreboard" id="scoreboard">
    <div class="scoreboard-side" data-side="left">
        <input type="text" class="scoreboard-name" id="scoreboard-name-left" value="Team A" maxlength="20">
        <span class="scoreboard-number" id="scoreboard-score-left">0</span>
        <button type="button" class="scoreboard-minus-btn" data-side="left">−1</button>
        <span class="scoreboard-tap-hint">Tap card to score</span>
    </div>

    <span class="scoreboard-divider">—</span>

    <div class="scoreboard-side" data-side="right">
        <input type="text" class="scoreboard-name" id="scoreboard-name-right" value="Team B" maxlength="20">
        <span class="scoreboard-number" id="scoreboard-score-right">0</span>
        <button type="button" class="scoreboard-minus-btn" data-side="right">−1</button>
        <span class="scoreboard-tap-hint">Tap card to score</span>
    </div>
</div>

<button type="button" class="scoreboard-reset" id="scoreboard-reset">Reset Score</button>

<div class="timer-widget">
    <div class="timer-display" id="timerDisplay">10:00</div>

    <div class="timer-controls">
        <button class="timer-adjust-btn" onclick="adjustTime(-20)">-20m</button>
        <button class="timer-adjust-btn" onclick="adjustTime(-10)">-10m</button>
        <button class="timer-adjust-btn" onclick="adjustTime(-5)">-5m</button>
        <button class="timer-adjust-btn" onclick="adjustTime(5)">+5m</button>
        <button class="timer-adjust-btn" onclick="adjustTime(10)">+10m</button>
        <button class="timer-adjust-btn" onclick="adjustTime(20)">+20m</button>
    </div>
    
    <div class="timer-actions">
        <button class="timer-start-btn" id="timerStartBtn" onclick="toggleTimer()">Start</button>
        <button class="timer-reset-btn" onclick="resetTimer()">Reset</button>
    </div>
</div>

<script>
    (function () {
        const sides = document.querySelectorAll('.scoreboard-side');
        const leftScore = document.getElementById('scoreboard-score-left');
        const rightScore = document.getElementById('scoreboard-score-right');
        const minusButtons = document.querySelectorAll('.scoreboard-minus-btn');
        const resetBtn = document.getElementById('scoreboard-reset');

        let scores = { left: 0, right: 0 };

        function render() {
            leftScore.textContent = scores.left;
            rightScore.textContent = scores.right;
        }

        function bump(side, delta) {
            scores[side] = Math.max(0, scores[side] + delta);
            render();
        }

        sides.forEach(function (el) {
            el.addEventListener('click', function (e) {
                // Don't score when editing the team name or pressing -1.
                if (e.target.classList.contains('scoreboard-name')) return;
                if (e.target.classList.contains('scoreboard-minus-btn')) return;
                bump(el.dataset.side, 1);
            });
        });

        minusButtons.forEach(function (btn) {
            btn.addEventListener('click', function (e) {
                e.stopPropagation(); // don't also trigger the card's +1 tap
                bump(btn.dataset.side, -1);
            });
        });

        resetBtn.addEventListener('click', function () {
            scores = { left: 0, right: 0 };
            render();
        });
    })();

    let remainingSeconds = 10 * 60;
    let endTimestamp = null;   // Date.now() + remainingSeconds*1000, only while running
    let timerInterval = null;
    let isRunning = false;

    const timerDisplay = document.getElementById('timerDisplay');
    const timerStartBtn = document.getElementById('timerStartBtn');

    function renderTime() {
        const clamped = Math.max(0, remainingSeconds);
        const minutes = Math.floor(clamped / 60);
        const seconds = clamped % 60;
        timerDisplay.textContent =
            String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');

        timerDisplay.classList.toggle('timer-done', clamped === 0);

        document.querySelectorAll('.timer-adjust-btn').forEach(btn => {
        const label = btn.textContent.trim();
        const isPlus = label.startsWith('+');
        const isMinus = label.startsWith('-');
        btn.disabled = (isPlus && clamped >= MAX_SECONDS) || (isMinus && clamped <= 0);
        });
    }

    function tick() {
        const secsLeft = Math.max(0, Math.round((endTimestamp - Date.now()) / 1000));
        remainingSeconds = secsLeft;
        renderTime();

        if (secsLeft <= 0) {
            stopTimer();
        }
    }

    const MAX_SECONDS = 90 * 60 //90 minute ceiling

    function adjustTime(minutesDelta) {
        remainingSeconds = Math.max(0, remainingSeconds + minutesDelta * 60);

        if (isRunning) {
            // Recalculate the end point so the running countdown reflects the change immediately.
            endTimestamp = Date.now() + remainingSeconds * 1000;
        }

        renderTime();
    }

    function toggleTimer() {
        if (isRunning) {
            stopTimer();
        } else {
            startTimer();
        }
    }

    function startTimer() {
        if (isRunning || remainingSeconds <= 0) return;

        isRunning = true;
        endTimestamp = Date.now() + remainingSeconds * 1000;
        timerStartBtn.textContent = 'Pause';
        timerInterval = setInterval(tick, 250);
    }

    function stopTimer() {
        isRunning = false;
        timerStartBtn.textContent = 'Start';
        clearInterval(timerInterval);
    }

    function resetTimer() {
        stopTimer();
        remainingSeconds = 10 * 60;
        renderTime();
    }

    renderTime();
</script>
{% endblock %}
